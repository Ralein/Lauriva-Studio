<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Left Leaf Gradients: lighter left side, slightly deeper right side -->
    <linearGradient id="leafLeftOuter" x1="0%" y1="80%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#2D6A4F" />
      <stop offset="50%" stop-color="#40916C" />
      <stop offset="100%" stop-color="#52B788" />
    </linearGradient>
    <linearGradient id="leafLeftInner" x1="0%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#1B4332" />
      <stop offset="60%" stop-color="#2D6A4F" />
      <stop offset="100%" stop-color="#40916C" />
    </linearGradient>

    <!-- Right Leaf Gradients: lighter right side, deeper inner side -->
    <linearGradient id="leafRightInner" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#1B4332" />
      <stop offset="50%" stop-color="#2D6A4F" />
      <stop offset="100%" stop-color="#40916C" />
    </linearGradient>
    <linearGradient id="leafRightOuter" x1="20%" y1="100%" x2="90%" y2="10%">
      <stop offset="0%" stop-color="#2D6A4F" />
      <stop offset="50%" stop-color="#52B788" />
      <stop offset="100%" stop-color="#74C69D" />
    </linearGradient>

    <!-- Stem Gradient -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D6A4F" />
      <stop offset="100%" stop-color="#1B4332" />
    </linearGradient>
  </defs>

  <!-- Central Stem at bottom -->
  <path d="M 238 385 
           C 236 405, 230 425, 222 445
           C 228 447, 235 448, 240 448
           C 246 430, 252 408, 252 385 Z" 
        fill="url(#stemGrad)" />

  <!-- Left Leaf (Tilted ~45 degrees left) -->
  <!-- Left half of left leaf -->
  <path d="M 238 385 
           C 175 385, 75 320, 48 240
           C 30 190, 45 135, 75 105
           C 115 155, 175 250, 238 385 Z" 
        fill="url(#leafLeftOuter)" />
  <!-- Right half of left leaf -->
  <path d="M 75 105 
           C 115 105, 175 140, 218 215
           C 238 250, 244 310, 238 385
           C 175 250, 115 155, 75 105 Z" 
        fill="url(#leafLeftInner)" />

  <!-- Right Leaf (Taller, pointing almost vertical ~15-20 deg right) -->
  <!-- Left/Inner half of right leaf -->
  <path d="M 245 385 
           C 244 300, 248 200, 280 115
           C 292 85, 305 60, 320 45
           C 310 120, 290 235, 245 385 Z" 
        fill="url(#leafRightInner)" />
  <!-- Right/Outer half of right leaf -->
  <path d="M 320 45 
           C 365 70, 415 125, 435 190
           C 455 255, 420 330, 370 365
           C 325 395, 275 392, 245 385
           C 290 235, 310 120, 320 45 Z" 
        fill="url(#leafRightOuter)" />
</svg>
